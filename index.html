<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="256x256" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#1c1917" />
    <meta name="description" content="Subscribe to an artist and get one of their postcards in the mail every month. Let's move beyond social media." />
    <title>yesiwantapostcard</title>
    <!--
      The postcard's own three faces (Patrick Hand, Sacramento, Quicksand),
      loaded regardless of the store's theme font — see CARD_FONTS_URL in
      shared/postcards.ts, which server/html.ts builds this same tag from for
      a server-rendered page. Kept in sync by hand: this file has no
      templating step, so it cannot import the constant.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" crossorigin />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      id="yiwap-card-fonts"
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Patrick+Hand&family=Sacramento&family=Quicksand:wght@400;600&display=swap"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
