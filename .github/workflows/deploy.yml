# Deploy to the droplet on every push to main.
#
# The box has no connection to GitHub; deploys are `git push production
# main`, which this does from a runner instead of a laptop. The push lands
# in /srv/postcards/repo.git, whose post-receive hook checks out, builds,
# restarts, and polls /api/health — its output streams back into this log.
#
# DEPLOY_SSH_KEY is a repository secret holding a private key made for this
# job alone; its public half is in /home/postcards/.ssh/authorized_keys on
# the droplet, restricted to git commands. docs/deploy.md has the details.

name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# One deploy at a time, and a newer push cancels a queued (not running) one.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DEPLOY_HOST: 24.199.117.121
      DEPLOY_HOST_KEY: "24.199.117.121 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIKJlcOmyoaFHXR64RFR6F8fZO0mP2UGPjAjxyGOsfTY8"
    steps:
      - uses: actions/checkout@v4
        with:
          # The push needs the full history, not a shallow clone.
          fetch-depth: 0

      - name: Install the deploy key
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          # Pinned, not scanned at run time: a scan would trust whatever answers.
          printf '%s\n' "$DEPLOY_HOST_KEY" > ~/.ssh/known_hosts
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}

      - name: Push to the droplet
        run: |
          git push "postcards@$DEPLOY_HOST:/srv/postcards/repo.git" HEAD:main
        env:
          GIT_SSH_COMMAND: ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes
